name: goal-gate
description: v0.1.32 — RunGoal refuses DONE while the static check fails, forcing a fix round
goal_gate: true
rounds: 3
files:
  go.mod: |
    module gate

    go 1.22
  main.go: |
    package main

    func main() { println("hi") }
goal: make the code use fmt.Println
steps:
  # the model writes fmt.Println but forgets the import -> the build breaks
  - tool_call: {name: fs_write, args: '{"path":"main.go","content":"package main\n\nfunc main() {\n\tfmt.Println(\"hi\")\n}\n"}'}
  - answer: I changed main.go to use fmt.Println
  - answer: DONE the refactor is complete
  # the goal gate runs workspace_diagnostics deterministically, sees the
  # missing import (go vet fails), feeds it back, and forces a second round
  - tool_call: {name: fs_edit, args: '{"path":"main.go","old_string":"package main\n\nfunc main() {","new_string":"package main\n\nimport \"fmt\"\n\nfunc main() {"}'}
  - answer: I added the import
  - answer: DONE now it compiles
assert:
  requests_contain: ["Deterministic completion check: the workspace still fails"]
  final_answer_contains: "added the import"
