name: fs-patch-partial-approval
description: M6.19+ — per-hunk approval keeps only the accepted hunk (patch_filter rewrites args)
patch_filter: first_hunk
files:
  a.go: |
    package pkg

    func one() int {
        return 1
    }

    func two() int {
        return 2
    }
input: apply the diff to a.go
steps:
  - tool_call: {name: fs_patch, args: '{"patch":"diff --git a/a.go b/a.go\n--- a/a.go\n+++ b/a.go\n@@ -3,3 +3,3 @@\n func one() int {\n-    return 1\n+    return 11\n }\n@@ -7,3 +7,3 @@\n func two() int {\n-    return 2\n+    return 22\n }\n"}'}
  - answer: Applied the accepted hunks.
assert:
  min_tool_results: 1
  file_contains: [{path: a.go, text: "return 11"}]
  file_not_contains: [{path: a.go, text: "return 22"}]
