name: budget-preserves-user-turn
description: small window over a two-turn tool flow; the budget prunes old tool output to a marker instead of swallowing the current user message
window: 300
summary: "SUM: the running summary"
files:
  big.txt: |
    
input: turn one message
inputs:
  - turn one message
  - turn two message
steps:
  - tool_call: {name: fs_read, args: '{"path":"big.txt"}'}
  - answer: done with turn one
  - answer: final answer for turn two
assert:
  final_answer_contains: turn two
  tool_results_contain: ["tool output concealed"]
  all_requests_have_user: true
