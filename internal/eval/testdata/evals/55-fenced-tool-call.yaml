name: fenced-tool-call
description: "AGY #3 — a tool call emitted inside a ```json fence (instead of the wire tool_calls field) is extracted and executed on the same turn, not nudged into a wasted round-trip"
files:
  main.go: |
    package main

    func main() { println("hi") }
input: read main.go
steps:
  - answer: |
      I will read it:
      ```json
      {"name": "fs_read", "arguments": {"path": "main.go"}}
      ```
  - answer: the file contains the main function
assert:
  tool_results_contain: ["package main"]
  final_answer_contains: "main function"
