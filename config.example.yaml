# Example Yagent configuration
# Copy to ~/.config/yagent/config.yaml (Linux) or your OS config dir, or use
# `yagent init` to generate one. All keys are optional; a per-repo
# `.yagent/config.yaml` in a workspace overrides these for that repo.
# Every key also has an env override (YAGENT_SERVER_URL, ...).

# OpenAI-compatible inference server (Ollama, llama.cpp — or any cloud
# OpenAI-compatible endpoint: OpenRouter, Groq, Together, Gemini).
server_url: http://localhost:11434
model: Qwen3VL-8B-Instruct-Q4_K_M.gguf
# api_key: ""                  # Bearer token for cloud endpoints (opt-in).
#                              # YAGENT_API_KEY env var works too; local-first
#                              # is the default (empty = no auth header).

# Embeddings: same server by default. Point at a dedicated model/server for
# better recall (e.g. a second llama-server running bge-m3).
embedding_model: nomic-embed-text
# embedding_server_url: http://localhost:8080

# TUI color palette: tokyo (default) | catppuccin | nord.
theme: tokyo

# Generation parameters forwarded on every chat request. temperature/top_p
# default to the Qwythos-9B recipe (0.6 / 0.95). top_k and repetition_penalty
# are 0 (off) by default because some OpenAI-compatible cloud endpoints reject
# them; set them here for local llama.cpp/Ollama:
# sampling:
#   temperature: 0.6
#   top_p: 0.95
#   top_k: 20
#   repetition_penalty: 1.05
#   min_p: 0.05                  # nucleus lower-bound filter (llama.cpp/Ollama)
#   reasoning_max_tokens: 1024   # cap thinking on reasoning models (biggest 12 GB speed lever)

# Per-model sampling profiles (v0.1.9): the first profile whose `match` is a
# substring of the resolved model name overrides the base sampling (unset
# fields inherit). Measured recipes from docs/models-benchmark.md — per-model
# sampling measurably matters, but verify it per model: LFM2.5-8B-A1B goes
# 10/18 -> 13/18 with its recipe, while LFM2.5-2.6B's recipe is within noise
# (its default is already good):
# models:
#   - match: LFM2.5-8B        # Liquid LFM2.5 8B-A1B (recipe helps: 10 -> 13/18)
#     temperature: 0.2
#     top_k: 80
#     repetition_penalty: 1.05
#   - match: LFM2.5-2.6B      # Liquid LFM2.5 2.6B (recipe ~ neutral on Yagent tasks)
#     temperature: 0.1
#     top_k: 50
#     repetition_penalty: 1.1
#   - match: Qwythos
#     top_k: 20
#     repetition_penalty: 1.05
#   - match: Qwen3VL-8B       # recommended default on a 12 GB card (18/18)
#     temperature: 0.6
#     top_p: 0.95
#   - match: Ornith-1.0-9B    # Qwen3.5 coding-agent model (14/18; fastest per task)
#     temperature: 0.6
#     top_p: 0.95
#     top_k: 20
#     repetition_penalty: 1.05

# Display preferences.
ui:
  show_reasoning: true   # dimmed "thinking" block for reasoning models

# Context window in tokens (also YAGENT_CONTEXT_WINDOW).
context_window: 16384

# data_dir: ~/.local/share/yagent   # sessions, memories, skills, logs

web_search:
  provider: duckduckgo        # duckduckgo | mojeek | searxng
  # searxng_url: http://localhost:8080

skills:
  write_approval: false       # false = skills apply immediately; true = stage for review
  # data_dir: ...
  # project_dir: ...

shell:
  sandbox: ""                 # "bwrap" wraps shell_exec in bubblewrap (Linux)

# VRAM pressure detector: when a stream's average t/s drops below this
# threshold (KV-cache spill signature on a 12 GB card), the next request
# force-prunes old tool output and the TUI shows a ⚠ VRAM pill. 0 = off.
# (also YAGENT_VRAM_THRESHOLD_TPS)
vram_threshold_tps: 5

consult:                      # the `consult` tool (advisor). Disabled until set.
  # server_url: http://localhost:11434
  # model: qwen2.5-coder:14b
  # api_key: ""               # for cloud OpenAI-compatible endpoints (opt-in)
  # cmd: ["claude", "-p"]     # OR an installed terminal AI app

# summarizer:                  # offload history condensation (budget + /compact)
#   server_url: http://laptop:11434   # to a second machine/model (e.g. a laptop).
#   model: qwen3:4b                   # Default (unset): the main model summarizes.
